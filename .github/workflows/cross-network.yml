name: Isolated real-network shared-save verification
on:
  push:
    branches: [codex/shared-scope-release-20260918]
permissions:
  contents: read
jobs:
  remote-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Cross-network browser using isolated synthetic subtree only
        run: node cross-network.cjs remote "$GITHUB_SHA"
        env:
          ALLOW_ISOLATED_FIREBASE_TEST: 'YES'
          BUNDLE_DIR: ${{ github.workspace }}
          RESULT_DIR: ${{ github.workspace }}/verification-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-network-remote
          path: verification-results/
