name: Shared-save regression and release identity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check runtime release identity
        run: node tests/check-release-build.cjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Run isolated shared-save regression
        run: node tests/shared-sync-regression.cjs

      - name: Check reconnect and durable update recovery
        run: |
          node tests/shared-bootstrap-retry.cjs
          node tests/shared-durable-update.cjs
          node tests/shared-diagnostics.cjs

      - name: Check resolved input settlement and confirmation acknowledgement
        run: |
          node tests/shared-resolved-settlement.cjs
          node tests/shared-confirm-ack.cjs
          node tests/shared-confirm-recovery.cjs
