<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'"><title>바른식당 공유 점검</title><style>body{font:17px/1.7 'Malgun Gothic',sans-serif;background:#f5f7f6;color:#203a30;margin:0;padding:28px}main{max-width:600px;margin:auto;background:white;padding:28px;border-radius:14px}button{padding:16px 22px;font:inherit;background:#18775f;color:white;border:0;border-radius:9px}p{white-space:pre-wrap}</style><main><h2>바른식당 공유 점검</h2><p>조리장 식단을 작성하던 노트북의 같은 브라우저에서 열어 주세요.<br>식단과 저장 대기 기록을 읽어 점검 파일로 보관합니다. 메뉴·마감·저장 대기는 변경하지 않습니다.</p><button id="save">점검 파일 받기</button><p id="status"></p></main><script>
'use strict';
async function readJournal(){
 if(!indexedDB.databases)throw Error('이 브라우저에서는 기존 보관소를 안전하게 확인할 수 없습니다.');
 const dbs=await indexedDB.databases();if(!dbs.some(x=>x.name==='bareun_operation_journal_v1'))return [];
 return new Promise((resolve,reject)=>{let db,tx,done=false;const end=(error,value)=>{if(done)return;done=true;clearTimeout(timer);if(db)db.close();error?reject(error):resolve(value)};const timer=setTimeout(()=>{if(tx)try{tx.abort()}catch{}end(Error('보관소 응답이 늦습니다. 기존 식단 창은 그대로 두세요.'))},15000);const request=indexedDB.open('bareun_operation_journal_v1');request.onupgradeneeded=()=>{request.transaction.abort();end(Error('기존 보관소가 없습니다.'))};request.onerror=()=>end(request.error);request.onblocked=()=>end(Error('보관소를 읽을 수 없습니다. 기존 식단 창은 닫지 마세요.'));request.onsuccess=()=>{db=request.result;if(done){db.close();return}if(!db.objectStoreNames.contains('operations')){end(Error('기록 보관소가 없습니다.'));return}tx=db.transaction('operations','readonly');let rows=[];const get=tx.objectStore('operations').getAll();get.onsuccess=()=>{rows=get.result.filter(r=>['shared-menu','shared-menu-resolutions','shared-menu-preserved-inputs'].includes(r.namespace))};tx.oncomplete=()=>end(null,rows);tx.onerror=tx.onabort=()=>end(tx.error||Error('읽기 실패'));};});
}
document.getElementById('save').onclick=async()=>{const button=document.getElementById('save'),status=document.getElementById('status');button.disabled=true;status.textContent='저장 대기 기록을 읽고 있습니다.';try{const journal=await readJournal(),legacy={};for(const key of ['bareun_v11','bareun_v11_pending_shared','bareun_v11_pending_shared_data','bareun_v11_pending_shared_error']){const value=localStorage.getItem(key);if(value!==null)legacy[key]=value}if(!journal.length&&!Object.keys(legacy).length)throw Error('이 브라우저에는 식단 입력 기록이 없습니다. 식단을 작성한 브라우저에서 열어 주세요.');const payload={schema:'bareun-readonly-support-v1',at:new Date().toISOString(),origin:location.origin,journal,legacy};const raw=JSON.stringify(payload);if(raw.length>100000000)throw Error('점검 기록이 큽니다. 기존 식단 창을 유지하고 알려 주세요.');const blob=new Blob([raw],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='바른식당_공유점검_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='점검 파일을 받았습니다. 이 파일을 현재 대화에 첨부해 주세요.\n식단과 저장 대기 기록은 변경하지 않았습니다.';}catch(e){status.textContent=e.message}finally{button.disabled=false}};
</script></html>
