</style></head><body><main class="app"><header class="head"><div class="brand">바른식당 메모</div><div id="conn" class="conn">연결 중</div></header><nav class="nav"><button data-view="today" class="on">오늘</button><button data-view="yesterday">어제</button><button data-view="search">검색</button></nav><div id="home"></div><section id="searchView" hidden><div class="modes"><button data-mode="meal">식단</button><button data-mode="menu" class="on">메뉴</button><button data-mode="ingredient">재료</button></div><div class="search"><input id="q" placeholder="메뉴명 또는 메모 내용"><button id="clear" aria-label="검색어 지우기">×</button></div><div id="results" class="section"></div></section></main><div id="modal" class="modal"><div class="sheet"><div class="sheethead"><h2 id="title"></h2><button id="close" class="close">×</button></div><div id="info" class="grid"></div><label for="memo">메모</label><textarea id="memo" placeholder="내용을 입력하세요"></textarea><div class="actions"><button id="cancel" class="btn">닫기</button><button id="save" class="btn save">저장</button></div><div class="history"><h3>기록</h3><div id="history"></div></div></div></div><div id="toast" class="toast"></div>
<script>
(function(){'use strict';
const TEST=/test/i.test(location.pathname);const CFG={apiKey:'AIzaSyCUaHd0bQ9ssLa_eItsP8lg7Z4AkPu4TwY',authDomain:'menu-plan-f01f7.firebaseapp.com',databaseURL:'https://menu-plan-f01f7-default-rtdb.firebaseio.com',projectId:'menu-plan-f01f7',storageBucket:'menu-plan-f01f7.firebasestorage.app',messagingSenderId:'987370306024',appId:'1:987370306024:web:fb8edcff1a15b7b7e34c1c'};
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));let root={},view='today',mode='menu',target=null,db=null,rootRef=null,pendingRemote=null,saveDraft=null,testUpdateCount=0,connected=false;
const mealNames={breakfast:'조식',lunch:'점심',dinner:'저녁','조식':'조식','점심':'점심','저녁':'저녁'};
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function day(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return iso(d)}function md(d){const x=new Date(d+'T12:00:00');return (x.getMonth()+1)+'/'+x.getDate()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s??'').normalize('NFKC').replace(/\s+/g,'').toLowerCase()}function fuzzy(text,q){const t=norm(text),n=norm(q);if(!n||t.includes(n))return true;let i=0;for(const c of t){if(c===n[i])i++;if(i===n.length)return true}return false}function arr(x){return Array.isArray(x)?x:Object.values(x||{})}function menus(m){const x=m&&((m.items||m.menus||m.menu));if(Array.isArray(x))return x.map(v=>typeof v==='string'?v:(v.name||v.menu||'')).filter(Boolean);if(typeof x==='string')return x.split(/[\n,]/).map(v=>v.trim()).filter(Boolean);return []}function people(d,k,m){const s=root.settings||{},keys=['people__'+d+'__'+k,'people__'+d+'__'+(mealNames[k]||k)];for(const z of keys)if(s[z]!==undefined)return Number(s[z])||0;return Number(m&&m.people)||0}function comboKey(items,meal){const raw=String(meal||'')+'|'+items.map(norm).sort().join('\u001f');let h=2166136261;for(let i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619)}return 'combo_'+(h>>>0).toString(16)}function order(){return root._order||root.orderState||{}}function mm(){return order().menuMemos||{}}function ts(v){return Number(v&&v.at)||0}function menuNotes(name){return Object.entries(mm()).filter(([,v])=>norm(v&&v.menu)===norm(name)&&String(v&&v.text||'').trim()).map(([id,v])=>({id,...v})).sort((a,b)=>ts(b)-ts(a))}function mealNotes(date,key,m){const names=menus(m),ck=comboKey(names,mealNames[key]||key);return {ck,list:arr((root.mealNotes||{})[ck]).filter(v=>v&&String(v.text||'').trim()).sort((a,b)=>ts(b)-ts(a)),names}}
function occurrences(){const out=[];Object.keys(root.plan||{}).sort().forEach(date=>Object.entries(root.plan[date]||{}).forEach(([k,m])=>menus(m).forEach(name=>out.push({kind:'menu',date,mealKey:k,meal:mealNames[k]||k,people:people(date,k,m),name,notes:menuNotes(name)}))));return out}
function fixture(){const t=day(0),y=day(-1);return{plan:{[t]:{lunch:{items:['매콤계란떡국','치즈듬뿍김치볶음밥'],people:640},dinner:{items:['김치','시리얼'],people:640}},[y]:{lunch:{items:['돈사태떡찜','매콤계란떡국'],people:630}}},settings:{},mealNotes:{},_order:{menuMemos:{},lines:{}}}}
function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1500)}function fmtTime(v){const n=Number(v)||0;return n?new Date(n).toLocaleString('ko-KR',{hour12:false}):'-'}
function setView(v){view=v;$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));$('#home').hidden=v==='search';$('#searchView').hidden=v!=='search';if(v==='search'){mode='menu';$$('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode==='menu'));$('#q').placeholder='메뉴명 또는 메모 내용';renderSearch()}else renderHome()}
function renderHome(){const date=view==='yesterday'?day(-1):day(0),p=(root.plan||{})[date]||{};let h='<div class="datebar"><strong>'+md(date)+' '+(view==='today'?'오늘':'어제')+'</strong><span>메뉴 메모</span></div><div class="section">';const entries=Object.entries(p);if(!entries.length)h+='<div class="empty">표시할 식단이 없습니다.</div>';entries.forEach(([k,m])=>{const ns=menus(m),mn=mealNames[k]||k,pack=mealNotes(date,k,m);h+='<div class="meal"><div class="mealhead"><strong>'+esc(mn)+'</strong><div><span class="people">'+people(date,k,m).toLocaleString()+'식</span><button class="pencil '+(pack.list.length?'has':'')+'" data-kind="meal" data-date="'+date+'" data-meal="'+esc(k)+'">✎</button></div></div>';ns.forEach(name=>{const notes=menuNotes(name);h+='<div class="row"><div class="name">'+esc(name)+'</div><button class="pencil '+(notes.length?'has':'')+'" data-kind="menu" data-name="'+esc(name)+'" data-date="'+date+'" data-meal="'+esc(k)+'">✎</button></div>'});h+='</div>'});h+='</div>';$('#home').innerHTML=h;bindPencils($('#home'))}
function ingEntries(){const lines=order().lines||{};return Object.entries(lines).map(([id,v])=>({kind:'ingredient',id,date:v.date||'',meal:v.meal||v.mealId||'',people:Number(v.people)||0,name:v.ing||v.ingredient||'',menu:v.menu||'',notes:v.memo?[{id,at:v.memoAt||0,text:v.memo}]:[]})).filter(x=>x.name)}
function mealEntries(){const out=[];Object.keys(root.plan||{}).forEach(date=>Object.entries(root.plan[date]||{}).forEach(([k,m])=>{const p=mealNotes(date,k,m);out.push({kind:'meal',id:p.ck,date,mealKey:k,meal:mealNames[k]||k,people:people(date,k,m),name:p.names.join(' · '),notes:p.list,names:p.names})}));return out}
function renderSearch(){const q=$('#q').value;let data=mode==='menu'?occurrences():mode==='ingredient'?ingEntries():mealEntries();data=data.filter(x=>fuzzy([x.name,x.menu,(x.notes||[]).map(n=>n.text).join(' ')].join(' '),q));data.sort((a,b)=>{const ah=(a.notes||[]).length?1:0,bh=(b.notes||[]).length?1:0;if(ah!==bh)return bh-ah;const at=Math.max(0,...(a.notes||[]).map(ts)),bt=Math.max(0,...(b.notes||[]).map(ts));return bt-at||String(b.date).localeCompare(String(a.date))||String(a.name).localeCompare(String(b.name),'ko')});let h='<div class="resulthead"><strong>'+({menu:'메뉴',ingredient:'재료',meal:'식단'}[mode])+'</strong><span>기록 '+data.length+'건</span></div>';if(!data.length)h+='<div class="empty">조건에 맞는 항목이 없습니다.</div>';data.forEach((x,i)=>{h+='<div class="row"><div class="name">'+esc(x.name||x.meal)+'</div><div class="meta">'+esc(md(x.date))+' · '+esc(x.meal||'')+(x.people?' · '+x.people.toLocaleString()+'식':'')+'</div><button class="pencil '+((x.notes||[]).length?'has':'')+'" data-index="'+i+'">✎</button></div>'});$('#results').innerHTML=h;$$('#results [data-index]').forEach(b=>b.onclick=()=>open(data[Number(b.dataset.index)]))}
function bindPencils(el){el.querySelectorAll('.pencil').forEach(b=>b.onclick=()=>{const date=b.dataset.date,k=b.dataset.meal,m=((root.plan||{})[date]||{})[k]||{};if(b.dataset.kind==='meal'){const p=mealNotes(date,k,m);open({kind:'meal',id:p.ck,date,mealKey:k,meal:mealNames[k]||k,people:people(date,k,m),name:p.names.join(' · '),names:p.names,notes:p.list})}else open({kind:'menu',date,mealKey:k,meal:mealNames[k]||k,people:people(date,k,m),name:b.dataset.name,notes:menuNotes(b.dataset.name)})})}
function open(x){target=x;saveDraft=null;$('#title').textContent=x.name||x.meal;$('#info').innerHTML='<div><small>식단일</small>'+esc(md(x.date))+'</div><div><small>식수</small>'+Number(x.people||0).toLocaleString()+'식</div><div><small>메뉴</small>'+esc(x.kind==='ingredient'?(x.menu||'-'):(x.name||'-'))+'</div><div><small>구분</small>'+esc(x.kind==='meal'?'식단 전체':x.kind==='menu'?'메뉴 전체':'재료')+'</div>';$('#memo').value='';renderHistory();$('#modal').classList.add('on')}
function renderHistory(){const list=target&&target.notes||[];$('#history').innerHTML=list.length?list.map((n,i)=>'<div class="hist"><div class="histtime">'+fmtTime(n.at)+'</div><div class="histbody"><div class="histtext">'+esc(n.text)+'</div><button class="del" data-hi="'+i+'">삭제</button></div></div>').join(''):'<div class="empty">기록이 없습니다.</div>';$$('.del').forEach(b=>b.onclick=()=>removeNote(target.notes[Number(b.dataset.hi)]))}
function editing(){return !!(target&&$('#modal').classList.contains('on'))}function applyRemote(next){if(editing()){pendingRemote=next||{};return false}root=next||{};render();return true}function applyPendingRemote(){if(!pendingRemote||editing())return false;const next=pendingRemote;pendingRemote=null;root=next;render();return true}function close(){target=null;saveDraft=null;$('#modal').classList.remove('on');$('#save').disabled=false;$('#save').textContent='저장';applyPendingRemote()}function timeout(p){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),9000))])}function localSave(){localStorage.setItem('bareun_mobile_memo_test_v2',JSON.stringify(root))}function patchLocal(map){Object.entries(map).forEach(([path,val])=>{const seg=path.split('/').filter(Boolean);let cur=root;seg.forEach((s,i)=>{if(i===seg.length-1){if(val===null)delete cur[s];else cur[s]=val}else cur=cur[s]||(cur[s]={})})})}function atPath(obj,path){return path.split('/').filter(Boolean).reduce((v,k)=>v==null?undefined:v[k],obj)}function sameValue(a,b){if(a===b)return true;if(a===null||b===null||typeof a!=='object'||typeof b!=='object')return false;if(Array.isArray(a)!==Array.isArray(b))return false;const ak=Object.keys(a).sort(),bk=Object.keys(b).sort();return ak.length===bk.length&&ak.every((k,i)=>k===bk[i]&&sameValue(a[k],b[k]))}function ackMatches(snap,map){const value=snap.val()||{};return Object.entries(map).filter(([p])=>!p.endsWith('/updatedAt')&&p!=='updatedAt').every(([p,want])=>{const got=atPath(value,p);return want===null?got===undefined||got===null:sameValue(got,want)})}async function updates(map){if(TEST){patchLocal(map);testUpdateCount++;localSave();return}if(!rootRef)throw new Error('not_connected');await rootRef.update(map);const ack=await rootRef.once('value');if(!ackMatches(ack,map))throw new Error('server_ack_mismatch');patchLocal(map)}
async function save(){const text=$('#memo').value.trim();if(!text)return toast('내용을 입력해 주세요.');const b=$('#save');b.disabled=true;b.textContent='저장 확인 중';const fingerprint=[target.kind,target.id||target.name||'',target.date||'',target.mealKey||'',text].join('|');if(!saveDraft||saveDraft.fingerprint!==fingerprint){const now=Date.now();saveDraft={fingerprint,now,id:'menuMemo_'+now.toString(36)+'_'+Math.random().toString(36).slice(2,8)}}const now=saveDraft.now,id=saveDraft.id;try{if(target.kind==='menu'){const v={id,menu:target.name,text,at:now,date:target.date,mealId:target.mealKey||'',meal:target.meal||''};await updates({['_order/menuMemos/'+id]:v,['_order/ts/menuMemos/'+id]:now,'_order/updatedAt':now})}else if(target.kind==='meal'){const v={id,text,at:now,date:target.date,meal:target.meal};if(target.names&&target.names.length)v.items=target.names;await updates({['mealNotes/'+target.id+'/'+id]:v})}else{await updates({['_order/lines/'+target.id+'/memo']:text,['_order/lines/'+target.id+'/memoAt']:now,['_order/ts/lines/'+target.id+'/memo']:now,'_order/updatedAt':now})}b.disabled=false;b.textContent='저장';close();toast('서버에 저장됐습니다.')}catch(e){b.disabled=false;b.textContent='저장';$('#conn').textContent='미동기화 · 재시도 필요';toast('서버 저장을 확인하지 못했습니다. 같은 내용으로 다시 시도해 주세요.')}}
async function removeNote(n){if(!confirm('이 메모를 삭제할까요?'))return;try{if(target.kind==='menu'){await updates({['_order/menuMemos/'+n.id]:null,['_order/ts/menuMemos/'+n.id]:null,'_order/updatedAt':Date.now()})}else if(target.kind==='meal'){if(n.id)await updates({['mealNotes/'+target.id+'/'+n.id]:null});else{const next=arr((root.mealNotes||{})[target.id]).filter(v=>!(Number(v.at)===Number(n.at)&&v.text===n.text));await updates({['mealNotes/'+target.id]:next.length?next:null})}}else await updates({['_order/lines/'+target.id+'/memo']:null,['_order/lines/'+target.id+'/memoAt']:null,['_order/ts/lines/'+target.id+'/memo']:null,'_order/updatedAt':Date.now()});await reload();target.notes=target.kind==='menu'?menuNotes(target.name):target.kind==='meal'?mealNotes(target.date,target.mealKey,((root.plan||{})[target.date]||{})[target.mealKey]||{}).list:ingEntries().find(x=>x.id===target.id)?.notes||[];renderHistory();toast('삭제됐습니다.')}catch(e){toast('삭제하지 못했습니다.')}}
async function reload(){if(TEST){root=JSON.parse(localStorage.getItem('bareun_mobile_memo_test_v2')||'null')||fixture();$('#conn').textContent='테스트';render();return}if(!rootRef)throw new Error('not_connected');const snap=await timeout(rootRef.once('value'));applyRemote(snap.val()||{})}function attachRealtime(){rootRef=db.ref('menuplan');rootRef.on('value',snap=>{applyRemote(snap.val()||{})},()=>{$('#conn').textContent='연결 실패 · 재시도 필요'});db.ref('.info/connected').on('value',snap=>{connected=snap.val()===true;$('#conn').textContent=connected?'실시간 연결됨':'오프라인 · 저장 대기'})}function render(){if(view==='search')renderSearch();else renderHome()}
$$('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));$$('.modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$$('.modes button').forEach(x=>x.classList.toggle('on',x===b));$('#q').placeholder=mode==='meal'?'메뉴명 또는 식단 메모':mode==='ingredient'?'재료명 또는 메모 내용':'메뉴명 또는 메모 내용';renderSearch()});$('#q').oninput=renderSearch;$('#clear').onclick=()=>{$('#q').value='';renderSearch()};$('#close').onclick=$('#cancel').onclick=close;$('#modal').onclick=e=>{if(e.target===$('#modal'))close()};$('#save').onclick=save;
