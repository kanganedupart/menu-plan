<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>바른식당 메모</title>
  <style>
    :root{--green:#0f7a5a;--blue:#2563d9;--ink:#17251f;--muted:#7d9087;--line:#dfe8e3;--bg:#f4f7f5;--white:#fff;--danger:#c43b3b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",Arial,sans-serif;font-size:14px;letter-spacing:0}
    button,input,textarea{font:inherit;letter-spacing:0}button{cursor:pointer}.app{max-width:680px;margin:auto;min-height:100vh;background:var(--white)}
    header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px 12px}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand strong{font-size:18px;color:#075f45}.sync{font-size:12px;color:var(--muted)}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tab{height:42px;border:1px solid var(--line);background:#fff;color:#4c6056;border-radius:6px;font-weight:700}.tab.active{background:var(--green);border-color:var(--green);color:#fff}
    main{padding:14px 14px 110px}.search{display:flex;gap:8px;margin-bottom:12px}.search input{min-width:0;flex:1;height:42px;border:1px solid var(--line);border-radius:6px;padding:0 12px;outline:none}.search input:focus{border-color:var(--green)}.clear{width:42px;border:1px solid var(--line);background:#fff;border-radius:6px;color:#6d8077}
    .summary{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px}.summary strong{font-size:15px}.summary span{font-size:12px;color:var(--muted)}
    .list{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center;width:100%;min-height:62px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}.row:active{background:#f7faf8}.title{font-weight:700;line-height:1.35}.meta{margin-top:5px;color:var(--muted);font-size:12px}.pencil{border:0;background:transparent;padding:4px;font-size:18px;color:#aab6b0}.pencil.has{color:var(--blue)}
    .empty{padding:56px 12px;text-align:center;color:var(--muted)}.fab{position:fixed;right:max(18px,calc((100vw - 680px)/2 + 18px));bottom:calc(20px + env(safe-area-inset-bottom));width:54px;height:54px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:28px;box-shadow:0 6px 18px #0f7a5a44}
    .shade{position:fixed;inset:0;z-index:20;background:#13251d66;display:none;align-items:flex-end;justify-content:center}.shade.open{display:flex}.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:8px 8px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheetHead h2{font-size:17px;margin:0}.iconBtn{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#63766d}
    .info{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);border-radius:6px;margin-bottom:14px}.info div{padding:9px;border-bottom:1px solid var(--line)}.info div:nth-child(odd){border-right:1px solid var(--line)}.info div:nth-last-child(-n+2){border-bottom:0}.info small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.info span{font-size:13px;overflow-wrap:anywhere}
    label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}.field,textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px;outline:none}textarea{min-height:112px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.btn{min-width:72px;height:40px;border-radius:6px;border:1px solid var(--line);background:#fff}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--danger)}.historyTitle{margin:18px 0 7px;font-weight:700}.history{border-top:1px solid var(--line)}.historyItem{padding:11px 2px;border-bottom:1px solid var(--line)}.historyItem time{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.historyItem p{margin:0;white-space:pre-wrap;line-height:1.45}
    .toast{position:fixed;z-index:40;left:50%;bottom:88px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 14px;border-radius:6px;background:#21332b;color:#fff;display:none}.toast.show{display:block}.toast.error{background:#9d3232}
    @media(min-width:681px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
  </style>
</head>
<body><div class="app">
  <header><div class="brand"><strong>바른식당 메모</strong><span class="sync" id="sync">불러오는 중</span></div><div class="tabs"><button class="tab" data-mode="meal">식단</button><button class="tab active" data-mode="menu">메뉴</button><button class="tab" data-mode="ingredient">재료</button></div></header>
  <main><div class="search"><input id="q" placeholder="메뉴명 또는 메모 내용"><button class="clear" id="clear" aria-label="검색 지우기">×</button></div><div class="summary"><strong id="heading">메뉴</strong><span id="count">기록 0건</span></div><div class="list" id="list"></div></main>
  <button class="fab" id="add" aria-label="메모 작성">＋</button>
</div>
<div class="shade" id="shade"><section class="sheet" role="dialog" aria-modal="true"><div class="sheetHead"><h2 id="sheetTitle">메모</h2><button class="iconBtn" id="close" aria-label="닫기">×</button></div><div class="info" id="info"></div><div id="selectors"></div><label for="memo">메모</label><textarea id="memo" placeholder="내용을 입력하세요"></textarea><div class="actions"><button class="btn danger" id="del">삭제</button><button class="btn" id="cancel">닫기</button><button class="btn primary" id="save">저장</button></div><div class="historyTitle">기록</div><div class="history" id="history"></div></section></div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(()=>{'use strict';
const TEST=/mobile-memo-test/i.test(location.pathname)||new URLSearchParams(location.search).has('test');
const CFG={apiKey:'AIzaSyCUaHd0bQ9ssLa_eItsP8lg7Z4AkPu4TwY',authDomain:'menu-plan-f01f7.firebaseapp.com',databaseURL:'https://menu-plan-f01f7-default-rtdb.firebaseio.com',projectId:'menu-plan-f01f7',storageBucket:'menu-plan-f01f7.firebasestorage.app',messagingSenderId:'987370306024',appId:'1:987370306024:web:fb8edcff1a15b7b7e34c1c'};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='menu',plan={},order={},items=[],current=null,db=null;
const mealLabel={breakfast:'조식',lunch:'점심',dinner:'저녁',조식:'조식',점심:'점심',저녁:'저녁'};
function fixture(){return {plan:{'2026-08-11':{lunch:{items:['김치볶음밥','콩나물국','과일']},dinner:{items:['감자조림','흰밥']}},'2026-08-10':{lunch:{items:['제육볶음','김치','흰밥']}}},mealNotes:{combo_demo:[{text:'후식 구성을 다음에는 바꾸기',at:Date.now()-86000000,date:'2026-08-11',meal:'점심',items:['김치볶음밥','콩나물국','과일']}]},_order:{menuMemos:{m1:{menu:'김치볶음밥',text:'볶음김치는 조금 덜 맵게',at:Date.now()-3600000,date:'2026-08-11',mealId:'lunch',meal:'점심'}},lines:{line1:{date:'2026-08-11',mealId:'lunch',menu:'김치볶음밥',ing:'볶음김치',memo:'김치 수분 확인',memoAt:Date.now()-7200000}},settings:{'people__2026-08-11__lunch':640}}};}
function normalizeMain(x){x=x||{};plan=x.plan||{};order=x._order||{};order.menuMemos=order.menuMemos||{};order.lines=order.lines||{};order.settings=order.settings||{};return x}
function connect(){if(TEST){normalizeMain(fixture());$('#sync').textContent='테스트판';render();return}try{firebase.initializeApp(CFG);db=firebase.database();db.ref('menuplan').on('value',s=>{normalizeMain(s.val());$('#sync').textContent='연결됨';render()},e=>{$('#sync').textContent='연결 오류';toast('데이터를 불러오지 못했습니다.',1)})}catch(e){$('#sync').textContent='연결 오류';toast('연결 설정을 확인해 주세요.',1)}}
function arr(v){return Array.isArray(v)?v:[]}
function names(rec){return arr(rec&&rec.items).map(x=>typeof x==='string'?x:String(x&&((x.name||x.n)||''))).filter(Boolean)}
function people(date,meal){const id={조식:'breakfast',점심:'lunch',저녁:'dinner'}[meal]||meal||'lunch',k='people__'+date+'__'+id;return Object.prototype.hasOwnProperty.call(order.settings,k)?Number(order.settings[k]||0):(id==='breakfast'?50:640)}
function menuNotes(name){return Object.entries(order.menuMemos).filter(([,x])=>String(x.menu||'').trim()===name).map(([id,x])=>({...x,id})).sort((a,b)=>(+b.at||0)-(+a.at||0))}
function mealEntries(){const out=[];Object.entries(plan).forEach(([date,meals])=>Object.entries(meals||{}).forEach(([mid,rec])=>{const ns=names(rec);if(!ns.length)return;const meal=mealLabel[mid]||mid;const notes=[];Object.values(window.__mainMealNotes||{}).forEach(()=>{});out.push({kind:'meal',id:date+'__'+mid,date,mealId:mid,meal,name:ns.join(' · '),menus:ns,people:people(date,meal),notes:mealNotesFor(date,meal,ns)})}));return out}
function mealNotesFor(date,meal,ns){const all=[];Object.entries(window.__mealNotes||{}).forEach(()=>{});Object.values(mainState.mealNotes||{}).forEach(bucket=>arr(bucket).forEach(x=>{if(x&&x.date===date&&(mealLabel[x.meal]||x.meal)===meal)all.push(x)}));return all.sort((a,b)=>(+b.at||0)-(+a.at||0))}
let mainState={};
const oldNorm=normalizeMain;normalizeMain=function(x){const r=oldNorm(x);mainState=r;return r};
function menuEntries(){const map=new Map;Object.entries(plan).forEach(([date,meals])=>Object.entries(meals||{}).forEach(([mid,rec])=>names(rec).forEach(name=>{const old=map.get(name),stamp=date.replaceAll('-','');if(!old||stamp>old.stamp)map.set(name,{kind:'menu',id:name,name,date,meal:mealLabel[mid]||mid,mealId:mid,people:people(date,mealLabel[mid]||mid),stamp})})));Object.values(order.menuMemos).forEach(x=>{const name=String(x.menu||'').trim();if(name&&!map.has(name))map.set(name,{kind:'menu',id:name,name,date:x.date||'',meal:mealLabel[x.mealId]||x.meal||'',mealId:x.mealId||'',people:people(x.date,x.mealId),stamp:String(x.date||'').replaceAll('-','')})});return [...map.values()].map(x=>({...x,notes:menuNotes(x.name)}))}
function lineValue(v,...keys){for(const k of keys)if(v&&v[k]!=null&&String(v[k]).trim())return String(v[k]).trim();return ''}
function ingredientEntries(){return Object.entries(order.lines).map(([encoded,x])=>{const ing=lineValue(x,'ing','ingredient','material','name');if(!ing)return null;return {kind:'ingredient',id:encoded,key:encoded,name:ing,date:lineValue(x,'date','d'),mealId:lineValue(x,'mealId','meal'),meal:mealLabel[lineValue(x,'mealId','meal')]||lineValue(x,'mealId','meal'),menu:lineValue(x,'menu','menuName'),people:people(lineValue(x,'date','d'),lineValue(x,'mealId','meal')),notes:String(x.memo||'').trim()?[{id:encoded,text:x.memo,at:x.memoAt||0}]:[],raw:x}}).filter(Boolean)}
function latest(x){return Math.max(0,...arr(x.notes).map(n=>+n.at||0))}
function build(){items=mode==='meal'?mealEntries():mode==='menu'?menuEntries():ingredientEntries();const q=$('#q').value.trim().toLowerCase();if(q)items=items.filter(x=>[x.name,x.menu,...arr(x.notes).map(n=>n.text)].join(' ').toLowerCase().includes(q));items.sort((a,b)=>(latest(b)>0)-(latest(a)>0)||latest(b)-latest(a)||String(b.date).localeCompare(String(a.date))||a.name.localeCompare(b.name,'ko'))}
function fmtDate(d){if(!d)return '-';const p=String(d).split('-');return p.length===3?Number(p[1])+'/'+Number(p[2]):d}function fmtAt(n){if(!n)return '-';const d=new Date(+n),p=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function render(){build();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('#heading').textContent={meal:'식단',menu:'메뉴',ingredient:'재료'}[mode];$('#q').placeholder={meal:'식단일 또는 메모 내용',menu:'메뉴명 또는 메모 내용',ingredient:'재료명 또는 메모 내용'}[mode];$('#count').textContent='기록 '+items.reduce((n,x)=>n+arr(x.notes).length,0)+'건';$('#list').innerHTML=items.length?items.map((x,i)=>'<button class="row" data-i="'+i+'"><span><span class="title">'+esc(x.name)+'</span><span class="meta">'+esc([fmtDate(x.date),x.meal,x.people?x.people+'식':''].filter(Boolean).join(' · '))+'</span></span><span class="pencil '+(latest(x)?'has':'')+'">✎</span></button>').join(''):'<div class="empty">표시할 항목이 없습니다.</div>'}
function infoHtml(x){return [['식단일',fmtDate(x.date)],['식수',x.people?x.people+'식':'-'],['메뉴',x.kind==='meal'?x.name:(x.menu||x.name)],['재료',x.kind==='ingredient'?x.name:(x.kind==='menu'?'메뉴 전체':'끼니 전체')],['작성일',fmtAt(latest(x))],['기록',arr(x.notes).length+'건']].map(v=>'<div><small>'+v[0]+'</small><span>'+esc(v[1])+'</span></div>').join('')}
function selectors(x,isNew){let h='';if(isNew){if(mode==='meal'){h='<label>식단</label><select class="field" id="target">'+mealEntries().map(v=>'<option value="'+esc(v.id)+'">'+esc(fmtDate(v.date)+' '+v.meal+' · '+v.name)+'</option>').join('')+'</select>'}if(mode==='menu'){h='<label>메뉴</label><input class="field" id="target" list="menuNames" placeholder="메뉴명"><datalist id="menuNames">'+menuEntries().map(v=>'<option value="'+esc(v.name)+'">').join('')+'</datalist>'}if(mode==='ingredient'){h='<label>재료</label><select class="field" id="target">'+ingredientEntries().map(v=>'<option value="'+esc(v.id)+'">'+esc(v.name+' · '+fmtDate(v.date)+' '+v.meal)+'</option>').join('')+'</select>'}}return h}
function open(x,isNew=false){current={...x,isNew};$('#sheetTitle').textContent=isNew?'메모 작성':x.name;$('#info').innerHTML=infoHtml(x);$('#selectors').innerHTML=selectors(x,isNew);$('#memo').value='';$('#del').style.display=isNew?'none':'';$('#history').innerHTML=arr(x.notes).length?arr(x.notes).map(n=>'<div class="historyItem"><time>'+esc(fmtAt(n.at))+'</time><p>'+esc(n.text||'')+'</p></div>').join(''):'<div class="empty">기록이 없습니다.</div>';$('#shade').classList.add('open');setTimeout(()=>$('#memo').focus(),60)}
function close(){current=null;$('#shade').classList.remove('open')}
function resolveTarget(){if(!current.isNew)return current;const t=$('#target');if(!t)return current;if(mode==='meal')return mealEntries().find(x=>x.id===t.value);if(mode==='menu'){const name=t.value.trim();return menuEntries().find(x=>x.name===name)||{kind:'menu',id:name,name,date:'',meal:'',people:0,notes:[]}}return ingredientEntries().find(x=>x.id===t.value)}
async function transact(mutator){if(TEST){mutator(mainState);localStorage.setItem('bareun_mobile_memo_test',JSON.stringify(mainState));return}await db.ref('menuplan').transaction(cur=>{cur=cur||{};mutator(cur);return cur})}
function comboHash(items,meal){let s=String(meal||'')+'|'+arr(items).map(x=>String(x&&x.n!==undefined?x.n:x)).sort().join('\u001f'),h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'combo_'+(h>>>0).toString(16)}
async function save(){const x=resolveTarget(),text=$('#memo').value.trim();if(!x||!text)return toast('대상과 메모 내용을 확인해 주세요.',1);busy(1);try{const at=Date.now();await transact(root=>{root._order=root._order||{};root._order.menuMemos=root._order.menuMemos||{};root._order.lines=root._order.lines||{};root._order.ts=root._order.ts||{};root._order.ts.menuMemos=root._order.ts.menuMemos||{};root._order.ts.lines=root._order.ts.lines||{};if(x.kind==='menu'){const id='menuMemo_'+at.toString(36)+'_'+Math.random().toString(36).slice(2,7);root._order.menuMemos[id]={menu:x.name,text,at,date:x.date||'',mealId:x.mealId||'',meal:x.meal||''};root._order.ts.menuMemos[id]=at} else if(x.kind==='ingredient'){const line=root._order.lines[x.key]||{};line.memo=text;line.memoAt=at;root._order.lines[x.key]=line;const ts=root._order.ts.lines[x.key]&&typeof root._order.ts.lines[x.key]==='object'?root._order.ts.lines[x.key]:{};ts.memo=at;ts.memoAt=at;root._order.ts.lines[x.key]=ts} else {root.mealNotes=root.mealNotes||{};const key=comboHash(x.menus,x.meal),bucket=arr(root.mealNotes[key]);bucket.push({text,at,date:x.date,meal:x.meal,items:x.menus});root.mealNotes[key]=bucket}root._order.updatedAt=at});toast('저장했습니다.');close()}catch(e){toast('저장하지 못했습니다. 다시 시도해 주세요.',1)}finally{busy(0)}}
async function del(){if(!current||!arr(current.notes).length)return close();const n=current.notes[0];busy(1);try{await transact(root=>{const at=Date.now();if(current.kind==='menu'){delete ((root._order||{}).menuMemos||{})[n.id];if(root._order&&root._order.ts&&root._order.ts.menuMemos)root._order.ts.menuMemos[n.id]=at}else if(current.kind==='ingredient'){root._order=root._order||{};root._order.lines=root._order.lines||{};root._order.ts=root._order.ts||{};root._order.ts.lines=root._order.ts.lines||{};const line=root._order.lines[current.key]||{};line.memo='';line.memoAt=at;root._order.lines[current.key]=line;const ts=root._order.ts.lines[current.key]&&typeof root._order.ts.lines[current.key]==='object'?root._order.ts.lines[current.key]:{};ts.memo=at;ts.memoAt=at;root._order.ts.lines[current.key]=ts}else{Object.keys(root.mealNotes||{}).forEach(k=>root.mealNotes[k]=arr(root.mealNotes[k]).filter(v=>!(+v.at===+n.at&&v.date===n.date)))}if(root._order)root._order.updatedAt=at});toast('삭제했습니다.');close()}catch(e){toast('삭제하지 못했습니다.',1)}finally{busy(0)}}
function busy(v){$('#save').disabled=!!v;$('#del').disabled=!!v;$('#save').textContent=v?'저장 중':'저장'}let tt;function toast(s,e){clearTimeout(tt);const el=$('#toast');el.textContent=s;el.className='toast show'+(e?' error':'');tt=setTimeout(()=>el.className='toast',2500)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$('#q').value='';render()});$('#q').oninput=render;$('#clear').onclick=()=>{$('#q').value='';render()};$('#list').onclick=e=>{const r=e.target.closest('.row');if(r)open(items[+r.dataset.i])};$('#add').onclick=()=>{const base=(mode==='meal'?mealEntries():mode==='menu'?menuEntries():ingredientEntries())[0]||{kind:mode,name:'새 메모',date:'',meal:'',people:0,notes:[]};open(base,true)};$('#close').onclick=$('#cancel').onclick=close;$('#shade').onclick=e=>{if(e.target===$('#shade'))close()};$('#save').onclick=save;$('#del').onclick=del;connect();
})();
</script></body></html>
